name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PLAYWRIGHT_VERSION: 1.63.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Unit and integration tests
        run: npm test

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      # Playwright stays out of package.json (ws is the only dependency), so
      # install it globally and point the browser tests at it.
      - name: Install Playwright
        run: |
          npm install --global "playwright@$PLAYWRIGHT_VERSION"
          echo "PLAYWRIGHT_MODULE=$(npm root -g)/playwright" >> "$GITHUB_ENV"

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # The browser tests skip themselves without Playwright; fail here instead.
      - name: Check Playwright loads
        run: node -e 'require(process.env.PLAYWRIGHT_MODULE)'

      - name: Browser tests
        run: npm run test:browser
