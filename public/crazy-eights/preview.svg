<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" class="tile-preview pv-ce">
<style>.pv-ce .bg{fill:var(--surface-2)}
.pv-ce .felt{fill:var(--accent-2);opacity:.14}
.pv-ce .face{fill:var(--surface);stroke:var(--border)}
.pv-ce .cb{fill:var(--accent);stroke:var(--accent-ink)}
.pv-ce .red{fill:var(--danger)}
.pv-ce .black{fill:var(--text)}
.pv-ce .rank{font:600 15px var(--font-display)}
.pv-ce .badge{fill:var(--surface);stroke:var(--danger);stroke-width:2}
.pv-ce .gone{animation-duration:.15s}</style>
<defs>
<path id="pv-ce-heart" d="M0 8.8C-1.6 6.8-9.4 1.6-9.4-3.2C-9.4-6.5-7-8.8-4.4-8.8C-2.4-8.8-0.8-7.6 0-5.8C0.8-7.6 2.4-8.8 4.4-8.8C7-8.8 9.4-6.5 9.4-3.2C9.4 1.6 1.6 6.8 0 8.8Z"/>
<path id="pv-ce-spade" d="M0-9.4C1.8-6.6 9-2.6 9 1.8C9 4.6 7 6.4 4.6 6.4C3 6.4 1.8 5.6 1.1 4.6C1.4 6.6 2.4 8.2 3.6 9.4H-3.6C-2.4 8.2-1.4 6.6-1.1 4.6C-1.8 5.6-3 6.4-4.6 6.4C-7 6.4-9 4.6-9 1.8C-9-2.6-1.8-6.6 0-9.4Z"/>
<path id="pv-ce-diamond" d="M0-9.6C2-6 4.6-2.8 7.6 0C4.6 2.8 2 6 0 9.6C-2 6-4.6 2.8-7.6 0C-4.6-2.8-2-6 0-9.6Z"/>
<g id="pv-ce-club"><circle cx="0" cy="-4.4" r="4.3"/><circle cx="-4.7" cy="1.6" r="4.3"/><circle cx="4.7" cy="1.6" r="4.3"/><circle cx="0" cy="0.4" r="2.4"/><path d="M-1.2 1.5C-1.1 5.2-2.2 7.8-4 9.4H4C2.2 7.8 1.1 5.2 1.2 1.5Z"/></g>
<!-- A card back takes its colours from the <use> (class cb): page styles don't reach inside a use. -->
<g id="pv-ce-back"><rect width="40" height="56" rx="5" stroke-opacity=".7"/><rect x="5" y="5" width="30" height="46" rx="3" fill="none" stroke-opacity=".45"/></g>
</defs>
<rect class="bg" width="320" height="200"/>
<ellipse class="felt" cx="160" cy="98" rx="120" ry="58"/>
<!-- the other player's hand, face down -->
<use class="cb" href="#pv-ce-back" x="95" y="-26"/>
<use class="cb" href="#pv-ce-back" x="125" y="-26"/>
<g class="gone" style="--d:1.3s"><use class="cb" href="#pv-ce-back" x="155" y="-26"/></g>
<use class="cb" href="#pv-ce-back" x="185" y="-26"/>
<!-- the stock -->
<use class="cb" href="#pv-ce-back" x="100" y="72"/>
<use class="cb" href="#pv-ce-back" x="98" y="70"/>
<use class="cb" href="#pv-ce-back" x="96" y="68"/>
<!-- the discard pile: a 5 of hearts to start -->
<g transform="translate(156 68)"><rect class="face" width="40" height="56" rx="5"/><text class="rank red" x="5" y="16">5</text><use href="#pv-ce-heart" class="red" transform="translate(20 32)"/></g>
<!-- your hand -->
<g transform="translate(80 146)"><rect class="face" width="40" height="56" rx="5"/><text class="rank black" x="5" y="16">2</text><use href="#pv-ce-club" class="black" transform="translate(20 32)"/></g>
<!-- you play the 7 of hearts on the 5 of hearts -->
<g class="slide" style="--d:0.3s;--x:-46px;--y:78px"><g transform="translate(156 68) rotate(-5 20 28)"><rect class="face" width="40" height="56" rx="5"/><text class="rank red" x="5" y="16">7</text><use href="#pv-ce-heart" class="red" transform="translate(20 32)"/></g></g>
<!-- they answer with the 7 of spades -->
<g class="fade" style="--d:1.3s"><g class="slide" style="--d:1.3s;--x:-1px;--y:-94px"><g transform="translate(156 68) rotate(4 20 28)"><rect class="face" width="40" height="56" rx="5"/><text class="rank black" x="5" y="16">7</text><use href="#pv-ce-spade" class="black" transform="translate(20 32)"/></g></g></g>
<!-- you play the 8 of clubs and name diamonds -->
<g class="slide" style="--d:2.3s;--x:14px;--y:78px"><g transform="translate(156 68) rotate(-2 20 28)"><rect class="face" width="40" height="56" rx="5"/><text class="rank black" x="5" y="16">8</text><use href="#pv-ce-club" class="black" transform="translate(20 32)"/></g></g>
<!-- the rest of your hand, over the cards it holds back -->
<g transform="translate(140 146)"><rect class="face" width="40" height="56" rx="5"/><text class="rank black" x="5" y="16">K</text><use href="#pv-ce-spade" class="black" transform="translate(20 32)"/></g>
<g transform="translate(200 146)"><rect class="face" width="40" height="56" rx="5"/><text class="rank red" x="5" y="16">J</text><use href="#pv-ce-diamond" class="red" transform="translate(20 32)"/></g>
<g class="pop" style="--d:2.8s"><circle class="badge" cx="198" cy="70" r="12"/><use href="#pv-ce-diamond" class="red" transform="translate(198 70) scale(.75)"/></g>
<!-- no diamond: they draw from the stock -->
<g class="slide" style="--d:3.5s;--x:-59px;--y:94px"><use class="cb" href="#pv-ce-back" x="155" y="-26"/></g>
<!-- player tags, lit in turn -->
<g class="a"><rect class="tag" x="250" y="6" width="30" height="14" rx="7"/><circle cx="258" cy="13" r="4" fill="currentColor"/><rect class="name" x="265" y="11.5" width="10" height="3" rx="1.5"/></g>
<g class="b"><rect class="tag" x="284" y="6" width="30" height="14" rx="7"/><circle cx="292" cy="13" r="4" fill="currentColor"/><rect class="name" x="299" y="11.5" width="10" height="3" rx="1.5"/></g>
<rect class="lit a" x="248" y="4" width="34" height="18" rx="9" style="--d:0s;--l:0.9s"/>
<rect class="lit b" x="282" y="4" width="34" height="18" rx="9" style="--d:1s;--l:0.9s"/>
<rect class="lit a" x="248" y="4" width="34" height="18" rx="9" style="--d:2s;--l:1.1s"/>
<rect class="lit b stay" x="282" y="4" width="34" height="18" rx="9" style="--d:3.2s"/>
</svg>
