<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff4e2"/>
      <stop offset="1" stop-color="#f6dcc0"/>
    </linearGradient>
    <radialGradient id="felt" cx="0.5" cy="0.45" r="0.75">
      <stop offset="0" stop-color="#3a927e"/>
      <stop offset="1" stop-color="#1f5c50"/>
    </radialGradient>
    <pattern id="lattice" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M5 0L10 5L5 10L0 5Z" fill="none" stroke="#ffe7d2" stroke-width=".8"/>
      <circle cx="5" cy="5" r="1.2" fill="#ffe7d2" opacity=".7"/>
    </pattern>
    <path id="heart" d="M0 8.8C-1.6 6.8-9.4 1.6-9.4-3.2C-9.4-6.5-7-8.8-4.4-8.8C-2.4-8.8-0.8-7.6 0-5.8C0.8-7.6 2.4-8.8 4.4-8.8C7-8.8 9.4-6.5 9.4-3.2C9.4 1.6 1.6 6.8 0 8.8Z"/>
    <path id="spade" d="M0-9.4C1.8-6.6 9-2.6 9 1.8C9 4.6 7 6.4 4.6 6.4C3 6.4 1.8 5.6 1.1 4.6C1.4 6.6 2.4 8.2 3.6 9.4H-3.6C-2.4 8.2-1.4 6.6-1.1 4.6C-1.8 5.6-3 6.4-4.6 6.4C-7 6.4-9 4.6-9 1.8C-9-2.6-1.8-6.6 0-9.4Z"/>
    <path id="diamond" d="M0-9.6C2-6 4.6-2.8 7.6 0C4.6 2.8 2 6 0 9.6C-2 6-4.6 2.8-7.6 0C-4.6-2.8-2-6 0-9.6Z"/>
    <g id="club"><circle cx="0" cy="-4.4" r="4.3"/><circle cx="-4.7" cy="1.6" r="4.3"/><circle cx="4.7" cy="1.6" r="4.3"/><circle cx="0" cy="0.4" r="2.4"/><path d="M-1.2 1.5C-1.1 5.2-2.2 7.8-4 9.4H4C2.2 7.8 1.1 5.2 1.2 1.5Z"/></g>
    <!-- An 8 drawn as two rings, so the icon needs no font. -->
    <g id="eight" fill="none" stroke-width="3.4"><ellipse cx="0" cy="-5.6" rx="5" ry="4.6"/><ellipse cx="0" cy="5.4" rx="6" ry="5.6"/></g>
  </defs>
  <rect width="320" height="200" fill="url(#paper)"/>
  <!-- a small felt table in a wooden rim -->
  <rect x="24" y="30" width="230" height="146" rx="34" fill="#a06d40"/>
  <rect x="30" y="36" width="218" height="134" rx="29" fill="url(#felt)" stroke="#6f4626" stroke-width="2"/>

  <!-- stock -->
  <g transform="translate(46 62) rotate(-4)">
    <rect x="4" y="4" width="62" height="88" rx="6" fill="#9c3f28"/>
    <rect width="62" height="88" rx="6" fill="#d65a3c" stroke="#ffe7d2" stroke-width="1"/>
    <rect x="5" y="5" width="52" height="78" rx="4" fill="url(#lattice)" stroke="#ffe7d2" stroke-width="1.2"/>
    <ellipse cx="31" cy="44" rx="13" ry="16" fill="#d65a3c" stroke="#ffe7d2" stroke-width="1.2"/>
    <path d="M31 33L33.6 40.6L41 38L35.7 44L41 50L33.6 47.4L31 55L28.4 47.4L21 50L26.3 44L21 38L28.4 40.6Z" fill="#ffe7d2"/>
  </g>

  <!-- the fan: 8 of clubs, 8 of spades, and the 8 of hearts in front -->
  <g transform="translate(152 104) rotate(-22) translate(-38 -56)">
    <rect width="76" height="106" rx="7" fill="#fffdf8" stroke="#cfc5b3" stroke-width="1.4"/>
    <use href="#eight" x="12" y="17" stroke="#20242e"/>
    <use href="#club" transform="translate(12 36) scale(.6)" fill="#20242e"/>
    <use href="#club" transform="translate(38 56) scale(1.6)" fill="#20242e"/>
  </g>
  <g transform="translate(176 98) rotate(-6) translate(-38 -56)">
    <rect width="76" height="106" rx="7" fill="#fffdf8" stroke="#cfc5b3" stroke-width="1.4"/>
    <use href="#eight" x="12" y="17" stroke="#20242e"/>
    <use href="#spade" transform="translate(12 36) scale(.6)" fill="#20242e"/>
    <use href="#spade" transform="translate(38 56) scale(1.6)" fill="#20242e"/>
  </g>
  <g transform="translate(204 100) rotate(12) translate(-38 -56)">
    <rect x="3" y="4" width="76" height="106" rx="7" fill="#123b33" opacity=".35"/>
    <rect width="76" height="106" rx="7" fill="#fffdf8" stroke="#cfc5b3" stroke-width="1.4"/>
    <use href="#eight" x="12" y="17" stroke="#c62a3b"/>
    <use href="#heart" transform="translate(12 36) scale(.6)" fill="#c62a3b"/>
    <circle cx="38" cy="56" r="21" fill="none" stroke="#c62a3b" stroke-width="1" stroke-dasharray="1 3" opacity=".6"/>
    <use href="#heart" transform="translate(38 56) scale(1.8)" fill="#c62a3b"/>
    <use href="#eight" transform="translate(64 89) rotate(180)" stroke="#c62a3b"/>
  </g>

  <!-- a burst of the suit the 8 names -->
  <g fill="#c62a3b">
    <use href="#heart" transform="translate(274 44) scale(.95)"/>
    <use href="#heart" transform="translate(294 82) scale(.6)"/>
    <use href="#heart" transform="translate(258 20) scale(.5)"/>
  </g>
  <g fill="#ffc23a"><path d="M286 132l3 6.5 7 .8-5.2 4.8 1.5 7-6.3-3.6-6.3 3.6 1.5-7-5.2-4.8 7-.8z"/><circle cx="300" cy="112" r="3.5"/><circle cx="240" cy="18" r="2.5"/><circle cx="16" cy="180" r="3"/></g>
</svg>
