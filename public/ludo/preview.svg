<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" class="tile-preview pv-ludo">
<style>.pv-ludo .a{color:var(--danger)}
.pv-ludo .b{color:var(--ok)}
.pv-ludo .c{color:var(--hit-2)}
.pv-ludo .d{color:var(--focus)}
.pv-ludo .bg{fill:var(--surface-2)}
.pv-ludo .frame,.pv-ludo .panel,.pv-ludo .log{fill:var(--surface);stroke:var(--border)}
.pv-ludo .yard,.pv-ludo .lane{fill:currentColor}
.pv-ludo .pad{fill:var(--surface)}
.pv-ludo .spot{fill:currentColor;opacity:.25}
.pv-ludo .track{fill:var(--surface)}
.pv-ludo .grid{fill:none;stroke:var(--border);stroke-width:.8}
.pv-ludo .star{fill:none;stroke:var(--muted);stroke-width:.8}
.pv-ludo use{stroke:var(--text);stroke-width:.8;stroke-opacity:.6}
.pv-ludo .die{fill:var(--surface);stroke:var(--control-border);stroke-width:1.5}
.pv-ludo .pip{fill:var(--text)}
.pv-ludo .pip .gone,.pv-ludo .pip .fade{animation-duration:.12s}
.pv-ludo .btn{fill:var(--accent)}
.pv-ludo .btn-text{fill:var(--accent-ink);font:600 10px var(--font-display);text-anchor:middle}
.pv-ludo .roll{transform-box:fill-box;transform-origin:center;animation-name:pv-ludo-roll;animation-duration:.55s}
.pv-ludo .out{animation-name:pv-ludo-arc;animation-duration:.45s}
.pv-ludo .sent{animation-name:pv-ludo-arc;animation-duration:.5s}
.pv-ludo .hop1{animation-name:pv-ludo-hop1;animation-duration:.25s}
.pv-ludo .blue-move{animation-name:pv-ludo-blue;animation-duration:.6s}
@keyframes pv-ludo-roll{from{transform:rotate(-360deg)}50%{transform:rotate(-120deg) scale(1.2)}}
@keyframes pv-ludo-arc{from{transform:translate(var(--x),var(--y))}50%{transform:translate(calc(var(--x)/2),calc(var(--y)/2 - 16px)) scale(1.4)}}
@keyframes pv-ludo-hop1{from{transform:translateY(var(--y))}50%{transform:translateY(calc(var(--y)/2 - 5px)) scale(1.2)}}
@keyframes pv-ludo-blue{0%{transform:translate(12px,24px)}16.7%{transform:translate(6px,19px) scale(1.2)}33.3%{transform:translate(0px,24px)}50%{transform:translate(0px,13px) scale(1.2)}66.7%{transform:translate(0px,12px)}83.3%{transform:translate(0px,1px) scale(1.2)}100%{transform:translate(0px,0px)}}</style>
