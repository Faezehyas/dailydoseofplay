<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" class="tile-preview pv-ludo">
<style>.pv-ludo .bg{fill:var(--surface-2)}
.pv-ludo .board{fill:var(--surface);stroke:var(--border)}
.pv-ludo .yard,.pv-ludo .start{fill:currentColor}
.pv-ludo .pad{fill:var(--surface)}
.pv-ludo .track{fill:var(--surface);stroke:var(--control-border)}
.pv-ludo .tk{stroke:var(--text);stroke-width:.8;stroke-opacity:.5}
.pv-ludo .die{fill:var(--surface);stroke:var(--text);stroke-width:1.4}
.pv-ludo .pip{fill:var(--text)}
.pv-ludo .pip .gone,.pv-ludo .pip .fade{animation-duration:.15s}
.pv-ludo .roll{transform-box:fill-box;transform-origin:center;animation-name:pv-ludo-roll;animation-duration:.65s}
.pv-ludo .hop{animation-name:pv-ludo-hop;animation-duration:.5s}
.pv-ludo .home{animation-name:pv-ludo-hop;animation-duration:.55s}
@keyframes pv-ludo-roll{from{transform:rotate(-360deg)}50%{transform:rotate(-120deg) scale(1.25)}}
@keyframes pv-ludo-hop{from{transform:translate(var(--x),var(--y))}50%{transform:translate(calc(var(--x)/2),calc(var(--y)/2 - 14px))}}</style>
