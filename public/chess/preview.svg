<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" class="tile-preview pv-chess">
<style>.pv-chess .bg{fill:var(--surface-2)}
.pv-chess .light{fill:var(--surface)}
.pv-chess .dark{fill:var(--border)}
.pv-chess .w{fill:var(--surface);stroke:var(--text);stroke-width:1.2;stroke-linejoin:round}
.pv-chess .k{fill:var(--text);stroke:var(--surface);stroke-width:.8;stroke-linejoin:round}
.pv-chess .check{fill:var(--danger);opacity:.45}
.pv-chess .mate{transform-box:fill-box;transform-origin:50% 100%;animation-name:pv-chess-mate;animation-duration:.5s}
@keyframes pv-chess-mate{to{transform:rotate(80deg)}}</style>
