<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" class="tile-preview pv-checkers">
<style>.pv-checkers .bg{fill:var(--surface-2)}
.pv-checkers .light{fill:var(--surface)}
.pv-checkers .dark{fill:var(--control-border)}
.pv-checkers use{stroke:var(--surface)}
.pv-checkers .crown{fill:var(--hit-2);stroke:var(--text);stroke-width:.8;stroke-linejoin:round}
.pv-checkers .jump{animation-name:pv-checkers-jump;animation-duration:.5s}
@keyframes pv-checkers-jump{from{transform:translate(var(--x),var(--y))}50%{transform:translate(calc(var(--x)/2),calc(var(--y)/2)) scale(1.35)}}</style>
<defs><g id="pv-checkers-man"><circle r="8" fill="currentColor" stroke="none"/><circle r="5" fill="none" stroke-width="1.2" opacity=".6"/></g></defs>
