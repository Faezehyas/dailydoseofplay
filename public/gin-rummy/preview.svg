<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" class="tile-preview pv-gr">
<style>.pv-gr .bg{fill:var(--surface-2)}
.pv-gr .felt{fill:var(--accent-2);opacity:.16}
.pv-gr .face{fill:var(--surface);stroke:var(--border)}
.pv-gr .cb{fill:var(--accent);stroke:var(--accent-ink)}
.pv-gr .red{color:var(--danger);fill:var(--danger)}
.pv-gr .black{color:var(--text);fill:var(--text)}
.pv-gr .meld{fill:var(--hit-2)}
.pv-gr .say{fill:var(--surface);stroke:currentColor;stroke-width:2}
.pv-gr .words{font:600 13px var(--font-display);fill:var(--text)}
.pv-gr .spark{fill:var(--hit-2)}</style>
<defs>
<path id="pv-gr-heart" d="M0 8.8C-1.6 6.8-9.4 1.6-9.4-3.2C-9.4-6.5-7-8.8-4.4-8.8C-2.4-8.8-0.8-7.6 0-5.8C0.8-7.6 2.4-8.8 4.4-8.8C7-8.8 9.4-6.5 9.4-3.2C9.4 1.6 1.6 6.8 0 8.8Z"/>
<path id="pv-gr-spade" d="M0-9.4C1.8-6.6 9-2.6 9 1.8C9 4.6 7 6.4 4.6 6.4C3 6.4 1.8 5.6 1.1 4.6C1.4 6.6 2.4 8.2 3.6 9.4H-3.6C-2.4 8.2-1.4 6.6-1.1 4.6C-1.8 5.6-3 6.4-4.6 6.4C-7 6.4-9 4.6-9 1.8C-9-2.6-1.8-6.6 0-9.4Z"/>
<path id="pv-gr-diamond" d="M0-9.6C2-6 4.6-2.8 7.6 0C4.6 2.8 2 6 0 9.6C-2 6-4.6 2.8-7.6 0C-4.6-2.8-2-6 0-9.6Z"/>
<g id="pv-gr-club"><circle cx="0" cy="-4.4" r="4.3"/><circle cx="-4.7" cy="1.6" r="4.3"/><circle cx="4.7" cy="1.6" r="4.3"/><circle cx="0" cy="0.4" r="2.4"/><path d="M-1.2 1.5C-1.1 5.2-2.2 7.8-4 9.4H4C2.2 7.8 1.1 5.2 1.2 1.5Z"/></g>
<!-- Ranks drawn as strokes in the card's colour (currentColor), so the preview needs no font. -->
<g id="pv-gr-7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M0 0H7L2.5 12"/></g>
<g id="pv-gr-8" fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="3.5" cy="3" rx="3" ry="2.8"/><ellipse cx="3.5" cy="9" rx="3.6" ry="3.2"/></g>
<g id="pv-gr-9" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="3.5" cy="3.6" r="3.3"/><path d="M6.8 3.6C6.8 8 5.6 11 2 12"/></g>
<g id="pv-gr-A" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M0 12L3.8 0L7.6 12M1.4 8H6.2"/></g>
<g id="pv-gr-K" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M0.5 0V12M7 0L0.8 6.6M3 4.4L7.4 12"/></g>
<g id="pv-gr-back"><rect width="34" height="48" rx="4" stroke-opacity=".7"/><rect x="4" y="4" width="26" height="40" rx="3" fill="none" stroke-opacity=".45"/></g>
<path id="pv-gr-star" d="M0-6L1.8-1.8L6 0L1.8 1.8L0 6L-1.8 1.8L-6 0L-1.8-1.8Z"/>
</defs>
<rect class="bg" width="320" height="200"/>
<ellipse class="felt" cx="160" cy="92" rx="130" ry="70"/>
<!-- the other hand, face down, and the stock beside the discard pile -->
<use class="cb" href="#pv-gr-back" x="126" y="-28"/>
<use class="cb" href="#pv-gr-back" x="143" y="-26"/>
<use class="cb" href="#pv-gr-back" x="160" y="-28"/>
<use class="cb" href="#pv-gr-back" x="121" y="64"/>
<use class="cb" href="#pv-gr-back" x="119" y="62"/>
<g transform="translate(166 62)"><rect class="face" width="34" height="48" rx="4"/><use href="#pv-gr-9" class="red" x="4" y="5"/><use href="#pv-gr-heart" class="red" transform="translate(17 30) scale(.8)"/></g>
<!-- your hand: 7 and 9 of clubs, the red aces, the king of spades -->
<g transform="translate(24 140)"><rect class="face" width="34" height="48" rx="4"/><use href="#pv-gr-7" class="black" x="4" y="5"/><use href="#pv-gr-club" class="black" transform="translate(17 30) scale(.8)"/></g>
<g transform="translate(92 140)"><rect class="face" width="34" height="48" rx="4"/><use href="#pv-gr-9" class="black" x="4" y="5"/><use href="#pv-gr-club" class="black" transform="translate(17 30) scale(.8)"/></g>
<g transform="translate(140 140)"><rect class="face" width="34" height="48" rx="4"/><use href="#pv-gr-A" class="red" x="4" y="5"/><use href="#pv-gr-heart" class="red" transform="translate(17 30) scale(.8)"/></g>
<g transform="translate(174 140)"><rect class="face" width="34" height="48" rx="4"/><use href="#pv-gr-A" class="red" x="4" y="5"/><use href="#pv-gr-diamond" class="red" transform="translate(17 30) scale(.8)"/></g>
<!-- you draw the 8 of clubs: 7-8-9 is a run -->
<g class="slide" style="--d:0.4s;--x:61px;--y:-78px"><use class="cb" href="#pv-gr-back" x="58" y="140"/></g>
<g class="fade" style="--d:0.9s"><g transform="translate(58 140)"><rect class="face" width="34" height="48" rx="4"/><use href="#pv-gr-8" class="black" x="4" y="5"/><use href="#pv-gr-club" class="black" transform="translate(17 30) scale(.8)"/></g></g>
<g class="pop" style="--d:1.1s"><rect class="meld" x="24" y="191" width="102" height="4" rx="2"/></g>
<!-- they throw the ace of spades; you take it: three aces -->
<g class="slide" style="--d:2.2s;--x:-42px;--y:-78px"><g class="slide" style="--d:1.4s;--y:-92px"><g class="fade" style="--d:1.4s"><g transform="translate(208 140)"><rect class="face" width="34" height="48" rx="4"/><use href="#pv-gr-A" class="black" x="4" y="5"/><use href="#pv-gr-spade" class="black" transform="translate(17 30) scale(.8)"/></g></g></g></g>
<g class="pop" style="--d:2.7s"><rect class="meld" x="140" y="191" width="102" height="4" rx="2"/></g>
<!-- the king goes, and it's gin -->
<g class="slide" style="--d:3.1s;--x:90px;--y:78px"><g transform="translate(166 62)"><rect class="face" width="34" height="48" rx="4"/><use href="#pv-gr-K" class="black" x="4" y="5"/><use href="#pv-gr-spade" class="black" transform="translate(17 30) scale(.8)"/></g></g>
<g class="a"><g class="pop" style="--d:3.4s"><rect class="say" x="222" y="76" width="52" height="26" rx="13"/><text class="words" x="235" y="94">Gin!</text></g></g>
<g class="pop" style="--d:3.5s"><use class="spark" href="#pv-gr-star" transform="translate(282 74)"/></g>
<g class="pop" style="--d:3.6s"><use class="spark" href="#pv-gr-star" transform="translate(214 110) scale(.7)"/></g>
<g class="pop" style="--d:3.7s"><use class="spark" href="#pv-gr-star" transform="translate(290 108) scale(.6)"/></g>
<!-- player tags, lit in turn -->
<g class="a"><rect class="tag" x="250" y="6" width="30" height="14" rx="7"/><circle cx="258" cy="13" r="4" fill="currentColor"/><rect class="name" x="265" y="11.5" width="10" height="3" rx="1.5"/></g>
<g class="b"><rect class="tag" x="284" y="6" width="30" height="14" rx="7"/><circle cx="292" cy="13" r="4" fill="currentColor"/><rect class="name" x="299" y="11.5" width="10" height="3" rx="1.5"/></g>
<rect class="lit a" x="248" y="4" width="34" height="18" rx="9" style="--d:0s;--l:1.3s"/>
<rect class="lit b" x="282" y="4" width="34" height="18" rx="9" style="--d:1.3s;--l:0.8s"/>
<rect class="lit a stay" x="248" y="4" width="34" height="18" rx="9" style="--d:2.1s"/>
</svg>
