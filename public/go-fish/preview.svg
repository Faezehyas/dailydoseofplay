<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" class="tile-preview pv-gf">
<style>.pv-gf .bg{fill:var(--surface-2)}
.pv-gf .pond{fill:var(--accent-2);opacity:.22}
.pv-gf .ring{fill:none;stroke:var(--accent-2);stroke-width:1.5;opacity:.45}
.pv-gf .face{fill:var(--surface);stroke:var(--border)}
.pv-gf .cb{fill:var(--accent);stroke:var(--accent-ink)}
.pv-gf .red{fill:var(--danger)}
.pv-gf .black{fill:var(--text)}
.pv-gf .rank{font:600 15px var(--font-display)}
.pv-gf .say{fill:var(--surface);stroke:currentColor;stroke-width:2}
.pv-gf .words{font:600 12px var(--font-display);fill:var(--text)}
.pv-gf .fish{fill:var(--accent)}
.pv-gf .eye{fill:var(--surface)}
.pv-gf .spark{fill:var(--gift)}
.pv-gf .leap{animation-name:go-fish-leap;animation-duration:.9s;animation-timing-function:linear}
@keyframes go-fish-leap{0%{opacity:0;transform:translate(112px,100px) rotate(-55deg) scale(1.5)}15%{opacity:1}50%{transform:translate(160px,44px) rotate(0deg) scale(1.5)}85%{opacity:1}100%{opacity:0;transform:translate(208px,100px) rotate(55deg) scale(1.5)}}</style>
<defs>
<path id="pv-gf-heart" d="M0 8.8C-1.6 6.8-9.4 1.6-9.4-3.2C-9.4-6.5-7-8.8-4.4-8.8C-2.4-8.8-0.8-7.6 0-5.8C0.8-7.6 2.4-8.8 4.4-8.8C7-8.8 9.4-6.5 9.4-3.2C9.4 1.6 1.6 6.8 0 8.8Z"/>
<path id="pv-gf-spade" d="M0-9.4C1.8-6.6 9-2.6 9 1.8C9 4.6 7 6.4 4.6 6.4C3 6.4 1.8 5.6 1.1 4.6C1.4 6.6 2.4 8.2 3.6 9.4H-3.6C-2.4 8.2-1.4 6.6-1.1 4.6C-1.8 5.6-3 6.4-4.6 6.4C-7 6.4-9 4.6-9 1.8C-9-2.6-1.8-6.6 0-9.4Z"/>
<path id="pv-gf-diamond" d="M0-9.6C2-6 4.6-2.8 7.6 0C4.6 2.8 2 6 0 9.6C-2 6-4.6 2.8-7.6 0C-4.6-2.8-2-6 0-9.6Z"/>
<g id="pv-gf-club"><circle cx="0" cy="-4.4" r="4.3"/><circle cx="-4.7" cy="1.6" r="4.3"/><circle cx="4.7" cy="1.6" r="4.3"/><circle cx="0" cy="0.4" r="2.4"/><path d="M-1.2 1.5C-1.1 5.2-2.2 7.8-4 9.4H4C2.2 7.8 1.1 5.2 1.2 1.5Z"/></g>
<!-- A card back takes its colours from the <use> (class cb): page styles don't reach inside a use. -->
<g id="pv-gf-back"><rect width="40" height="56" rx="5" stroke-opacity=".7"/><rect x="5" y="5" width="30" height="46" rx="3" fill="none" stroke-opacity=".45"/></g>
<path id="pv-gf-star" d="M0-6L1.8-1.8L6 0L1.8 1.8L0 6L-1.8 1.8L-6 0L-1.8-1.8Z"/>
</defs>
<rect class="bg" width="320" height="200"/>
<!-- the pond, with the stock in it -->
<ellipse class="pond" cx="160" cy="100" rx="78" ry="30"/>
<ellipse class="ring" cx="160" cy="104" rx="56" ry="16"/>
<use class="cb" href="#pv-gf-back" x="142" y="70"/>
<use class="cb" href="#pv-gf-back" x="140" y="68"/>
<!-- the other player's hand, face down -->
<use class="cb" href="#pv-gf-back" x="110" y="-30"/>
<use class="cb" href="#pv-gf-back" x="140" y="-30"/>
<use class="cb" href="#pv-gf-back" x="170" y="-30"/>
<!-- your hand: a 7, a 3 and a king -->
<g transform="translate(80 146)"><rect class="face" width="40" height="56" rx="5"/><text class="rank red" x="5" y="16">7</text><use href="#pv-gf-heart" class="red" transform="translate(20 32)"/></g>
<g transform="translate(118 146)"><rect class="face" width="40" height="56" rx="5"/><text class="rank black" x="5" y="16">3</text><use href="#pv-gf-spade" class="black" transform="translate(20 32)"/></g>
<g transform="translate(156 146)"><rect class="face" width="40" height="56" rx="5"/><text class="rank red" x="5" y="16">K</text><use href="#pv-gf-diamond" class="red" transform="translate(20 32)"/></g>
<!-- "Got any 7s?" -->
<g class="a"><g class="gone" style="--d:1.6s"><g class="pop" style="--d:0.3s"><rect class="say" x="14" y="118" width="96" height="22" rx="11"/><text class="words" x="24" y="133">Got any 7s?</text></g></g></g>
<!-- "Go fish!" -->
<g class="b"><g class="gone" style="--d:2.4s"><g class="pop" style="--d:1.2s"><rect class="say" x="206" y="34" width="70" height="22" rx="11"/><text class="words" x="217" y="49">Go fish!</text></g></g></g>
<!-- a fish leaps from the pond -->
<g class="leap" style="--d:1.4s"><path class="fish" d="M-17 0C-11-8 2-10 10-3L18-8V8L10 3C2 10-11 8-17 0Z"/><circle class="eye" cx="-11" cy="-1.5" r="2"/></g>
<!-- you draw from the pond: a 7, a lucky catch -->
<g class="slide" style="--d:2.4s;--x:-54px;--y:-78px"><use class="cb" href="#pv-gf-back" x="194" y="146"/></g>
<g class="fade" style="--d:3s"><g transform="translate(194 146)"><rect class="face" width="40" height="56" rx="5"/><text class="rank black" x="5" y="16">7</text><use href="#pv-gf-club" class="black" transform="translate(20 32)"/></g></g>
<g class="pop" style="--d:3.2s"><use class="spark" href="#pv-gf-star" transform="translate(240 150)"/></g>
<g class="pop" style="--d:3.3s"><use class="spark" href="#pv-gf-star" transform="translate(190 140) scale(.7)"/></g>
<g class="pop" style="--d:3.4s"><use class="spark" href="#pv-gf-star" transform="translate(244 176) scale(.6)"/></g>
<!-- player tags, lit in turn -->
<g class="a"><rect class="tag" x="250" y="6" width="30" height="14" rx="7"/><circle cx="258" cy="13" r="4" fill="currentColor"/><rect class="name" x="265" y="11.5" width="10" height="3" rx="1.5"/></g>
<g class="b"><rect class="tag" x="284" y="6" width="30" height="14" rx="7"/><circle cx="292" cy="13" r="4" fill="currentColor"/><rect class="name" x="299" y="11.5" width="10" height="3" rx="1.5"/></g>
<rect class="lit a" x="248" y="4" width="34" height="18" rx="9" style="--d:0s;--l:1.1s"/>
<rect class="lit b" x="282" y="4" width="34" height="18" rx="9" style="--d:1.1s;--l:1.2s"/>
<rect class="lit a stay" x="248" y="4" width="34" height="18" rx="9" style="--d:2.3s"/>
</svg>
