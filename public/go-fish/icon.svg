<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef8fa"/>
      <stop offset="1" stop-color="#d6ecf1"/>
    </linearGradient>
    <radialGradient id="water" cx="0.5" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#4aa2b9"/>
      <stop offset="1" stop-color="#22677f"/>
    </radialGradient>
    <linearGradient id="fish" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff8a6b"/>
      <stop offset="1" stop-color="#e2553a"/>
    </linearGradient>
    <path id="heart" d="M0 8.8C-1.6 6.8-9.4 1.6-9.4-3.2C-9.4-6.5-7-8.8-4.4-8.8C-2.4-8.8-0.8-7.6 0-5.8C0.8-7.6 2.4-8.8 4.4-8.8C7-8.8 9.4-6.5 9.4-3.2C9.4 1.6 1.6 6.8 0 8.8Z"/>
    <path id="spade" d="M0-9.4C1.8-6.6 9-2.6 9 1.8C9 4.6 7 6.4 4.6 6.4C3 6.4 1.8 5.6 1.1 4.6C1.4 6.6 2.4 8.2 3.6 9.4H-3.6C-2.4 8.2-1.4 6.6-1.1 4.6C-1.8 5.6-3 6.4-4.6 6.4C-7 6.4-9 4.6-9 1.8C-9-2.6-1.8-6.6 0-9.4Z"/>
    <path id="diamond" d="M0-9.6C2-6 4.6-2.8 7.6 0C4.6 2.8 2 6 0 9.6C-2 6-4.6 2.8-7.6 0C-4.6-2.8-2-6 0-9.6Z"/>
    <!-- A 7 drawn as a stroke, so the icon needs no font. -->
    <path id="seven" d="M-5-7H5L-1 8" fill="none" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
    <g id="card">
      <rect width="66" height="92" rx="7" fill="#fffdf8" stroke="#cfc5b3" stroke-width="1.4"/>
    </g>
  </defs>
  <rect width="320" height="200" fill="url(#paper)"/>

  <!-- the pond, with rings spreading where the fish broke the surface -->
  <ellipse cx="190" cy="168" rx="150" ry="40" fill="url(#water)"/>
  <ellipse cx="236" cy="160" rx="44" ry="11" fill="none" stroke="#bfe6ef" stroke-width="2" opacity=".75"/>
  <ellipse cx="236" cy="160" rx="26" ry="6.5" fill="none" stroke="#bfe6ef" stroke-width="2" opacity=".9"/>
  <ellipse cx="110" cy="176" rx="34" ry="7" fill="none" stroke="#bfe6ef" stroke-width="1.5" opacity=".45"/>

  <!-- three 7s fanned in a hand -->
  <g transform="translate(70 92) rotate(-20) translate(-33 -46)">
    <use href="#card"/>
    <use href="#seven" x="12" y="15" stroke="#20242e"/>
    <use href="#spade" transform="translate(12 33) scale(.55)" fill="#20242e"/>
    <use href="#spade" transform="translate(33 52) scale(1.5)" fill="#20242e"/>
  </g>
  <g transform="translate(94 86) rotate(-5) translate(-33 -46)">
    <use href="#card"/>
    <use href="#seven" x="12" y="15" stroke="#c62a3b"/>
    <use href="#diamond" transform="translate(12 33) scale(.55)" fill="#c62a3b"/>
    <use href="#diamond" transform="translate(33 52) scale(1.5)" fill="#c62a3b"/>
  </g>
  <g transform="translate(120 90) rotate(11) translate(-33 -46)">
    <rect x="3" y="4" width="66" height="92" rx="7" fill="#123b47" opacity=".3"/>
    <use href="#card"/>
    <use href="#seven" x="12" y="15" stroke="#c62a3b"/>
    <use href="#heart" transform="translate(12 33) scale(.55)" fill="#c62a3b"/>
    <use href="#heart" transform="translate(33 52) scale(1.6)" fill="#c62a3b"/>
  </g>

  <!-- the question -->
  <g transform="translate(176 22)">
    <path d="M10 0H62A10 10 0 0 1 72 10V30A10 10 0 0 1 62 40H30L18 52L20 40H10A10 10 0 0 1 0 30V10A10 10 0 0 1 10 0Z" fill="#ffffff" stroke="#2a7189" stroke-width="2.4" stroke-linejoin="round"/>
    <use href="#seven" transform="translate(24 20) scale(1.25)" stroke="#20242e"/>
    <path d="M42 13.5A6 6 0 1 1 49.5 19.6C48 20.4 47.4 21.5 47.4 23.5" fill="none" stroke="#2a7189" stroke-width="3.2" stroke-linecap="round"/>
    <circle cx="47.4" cy="29.5" r="2.2" fill="#2a7189"/>
  </g>

  <!-- a fish leaping out of the pond -->
  <g transform="translate(246 116) rotate(32)">
    <path d="M-34 0C-22-17 4-20 20-6L36-17V17L20 6C4 20-22 17-34 0Z" fill="url(#fish)"/>
    <path d="M-6-13Q2-24 12-14" fill="#e2553a"/>
    <path d="M-14-9Q-8 0-14 9" fill="none" stroke="#b7402a" stroke-width="2" stroke-linecap="round" opacity=".55"/>
    <circle cx="-23" cy="-3" r="4" fill="#ffffff"/>
    <circle cx="-22.2" cy="-2.6" r="2" fill="#1d2129"/>
  </g>
  <g fill="#bfe6ef">
    <path d="M266 150c-2.5-4-2-7 0-9 2 2 2.5 5 0 9z"/>
    <path d="M282 142c-2.5-4-2-7 0-9 2 2 2.5 5 0 9z"/>
    <path d="M252 146c-2-3.2-1.6-5.6 0-7.2 1.6 1.6 2 4 0 7.2z"/>
  </g>
</svg>
