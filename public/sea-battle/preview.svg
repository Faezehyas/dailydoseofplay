<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" class="tile-preview pv-sb">
<style>.pv-sb .bg{fill:var(--surface-2)}
.pv-sb .water{fill:var(--water)}
.pv-sb .grid{fill:none;stroke:var(--water-line);stroke-width:1}
.pv-sb .ship{fill:var(--ship);stroke:var(--ship-edge);stroke-width:1.2}
.pv-sb .ring{fill:none;stroke:var(--miss);stroke-width:2}
.pv-sb .miss{fill:var(--miss)}
.pv-sb .flame{fill:var(--hit);stroke:var(--hit-2);stroke-width:1.5}
.pv-sb .x{fill:none;stroke:var(--sunk);stroke-width:2.5;stroke-linecap:round}
.pv-sb .sink{transform-box:fill-box;transform-origin:center;animation-name:pv-sb-sink;animation-duration:.8s;animation-timing-function:ease-in}
@keyframes pv-sb-sink{to{opacity:.25;transform:translateY(5px) rotate(10deg) scale(.85)}}</style>
