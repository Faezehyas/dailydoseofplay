<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" class="tile-preview pv-sb">
<style>.pv-sb .bg{fill:var(--surface-2)}
.pv-sb .water{fill:var(--water);stroke:var(--water-line)}
.pv-sb .grid{fill:none;stroke:var(--water-line);stroke-width:.8}
.pv-sb .label{fill:var(--muted)}
.pv-sb .pill{fill:var(--hit);opacity:.45}
.pv-sb .pill-sunk{fill:var(--ship)}
.pv-sb .hull{fill:var(--ship);stroke:var(--ship-edge);stroke-width:1}
.pv-sb .sunk .hull{fill:var(--sunk);stroke:var(--hit);stroke-width:1.2}
.pv-sb .ring{fill:none;stroke:var(--miss);stroke-width:1.3}
.pv-sb .dot{fill:var(--miss)}
.pv-sb .hitmark{fill:none;stroke:var(--hit);stroke-width:1.4;stroke-linecap:round}
.pv-sb .sight{fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round}
.pv-sb .splash{fill:none;stroke:var(--miss);stroke-width:1.5;opacity:0;transform-box:fill-box;transform-origin:center;animation-name:pv-sb-splash;animation-duration:.6s;animation-fill-mode:forwards}
.pv-sb .burst{fill:var(--hit-2);stroke:var(--hit);stroke-width:1;opacity:0;transform-box:fill-box;transform-origin:center;animation-name:pv-sb-burst;animation-duration:.6s;animation-fill-mode:forwards}
@keyframes pv-sb-splash{from{opacity:1;transform:scale(.3)}to{opacity:0;transform:scale(2)}}
@keyframes pv-sb-burst{from{opacity:1;transform:scale(.2)}60%{opacity:1;transform:scale(1.3)}to{opacity:0;transform:scale(1.5)}}</style>
