<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" class="tile-preview pv-cl">
<style>.pv-cl .bg{fill:var(--surface-2)}
.pv-cl .sq{fill:var(--surface);stroke:var(--border)}
.pv-cl .sq2{fill:var(--water)}
.pv-cl .ladder{fill:none;stroke:var(--ok);stroke-width:2.5;stroke-linecap:round}
.pv-cl .chute{fill:none;stroke:var(--gift);stroke-width:9;stroke-linecap:round;opacity:.75}
.pv-cl .rim{fill:var(--control-border)}
.pv-cl .s1{fill:var(--surface)}
.pv-cl .s2{fill:var(--surface-2)}
.pv-cl .num{fill:var(--text);font:600 13px var(--font-display);text-anchor:middle}
.pv-cl .arrow,.pv-cl .hub{fill:var(--text)}
.pv-cl .slide{animation-duration:.5s}
.pv-cl .hop{animation-name:pv-cl-hop;animation-duration:.4s}
.pv-cl .chute-slide{animation-name:pv-slide;animation-duration:.55s;animation-timing-function:ease-in}
.pv-cl .spin{transform-box:view-box;transform-origin:250px 112px;animation-name:pv-cl-spin;animation-duration:.9s}
.pv-cl .spin .spin{animation-name:pv-cl-spin2}
@keyframes pv-cl-hop{from{transform:translateX(var(--x))}50%{transform:translate(calc(var(--x)/2),-8px)}}
@keyframes pv-cl-spin{from{transform:rotate(-720deg)}}
@keyframes pv-cl-spin2{from{transform:rotate(-780deg)}}</style>
