<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" class="tile-preview pv-bg">
<style>.pv-bg .bg{fill:var(--surface-2)}
.pv-bg .frame{fill:var(--control-border)}
.pv-bg .felt{fill:var(--surface)}
.pv-bg .pt1{fill:var(--border)}
.pv-bg .pt2{fill:var(--water-line)}
.pv-bg .man{fill:currentColor;stroke:var(--surface);stroke-width:1.2}
.pv-bg .slide{animation-duration:.6s}
.pv-bg .die{fill:var(--surface);stroke:var(--text);stroke-width:1.2}
.pv-bg .pip{fill:var(--text)}
.pv-bg .gone{animation-duration:.15s}
.pv-bg .fade{animation-duration:.15s}
.pv-bg .roll{transform-box:fill-box;transform-origin:center;animation-name:pv-bg-roll;animation-duration:.8s}
@keyframes pv-bg-roll{from{opacity:0;transform:translate(60px,-40px) rotate(-560deg)}}</style>
